name: Documentation checks

on:
  push:
  pull_request:
  schedule:
    - cron: '30 18 * * *'   # nightly(UTC)完整外链与 freshness
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    # PR 与 push 的确定性门禁:工具单测、本地链接、锚点、结构、证据、数据、生成物漂移、Prompt 结构、manifest、lab 元数据
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10' # pyproject.toml 声明的最低支持版本
      - run: npm ci
      - run: npm run docs:check
      - name: 生成物漂移(二次防线)
        run: npm run docs:generate && git diff --exit-code
      - name: 计算器测试与 CLI smoke
        run: |
          pip install pytest==8.3.4
          PYTHONPATH=calculators/src python -m pytest calculators/tests -q
          PYTHONPATH=calculators/src python -m ai_infra_calc --help

  external-links:
    # 完整外链扫描放 nightly 与手动触发;404/410 失败,403/429/timeout 仅警告
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run docs:check:external-links
      - run: npm run docs:check:mermaid

  freshness-report:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-data.mjs --freshness-report
      - run: node scripts/validate-chapters.mjs --red-report
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freshness-and-review-reports
          path: reports/

  release-gate:
    # 发布门禁:手动触发;图片授权非 approved 即失败
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/validate-images.mjs --release
