<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">同一份状态在不同层有不同的完成语义</title><desc id="desc">编辑决策矩阵；具体持久性由目标存储实现和部署故障域验证</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">同一份状态在不同层有不同的完成语义</text><text x="48" y="72" class="sub">编辑决策矩阵；具体持久性由目标存储实现和部署故障域验证</text><text x="112.5" y="120" text-anchor="middle" class="label">落点</text><text x="305" y="120" text-anchor="middle" class="label">确认完成条件</text><text x="547.5" y="120" text-anchor="middle" class="label">耐受故障域</text><text x="795" y="120" text-anchor="middle" class="label">恢复用途</text><rect x="45" y="145" width="135" height="68" rx="8" fill="#fff4e5" stroke="#cbd5e1"/><text x="112.5" y="185" text-anchor="middle" class="label">本地暂存</text><rect x="190" y="145" width="230" height="68" rx="8" fill="#fff4e5" stroke="#cbd5e1"/><text x="305" y="185" text-anchor="middle" class="small">分片写入本节点</text><rect x="430" y="145" width="235" height="68" rx="8" fill="#fff4e5" stroke="#cbd5e1"/><text x="547.5" y="185" text-anchor="middle" class="small">不能跨节点故障</text><rect x="675" y="145" width="240" height="68" rx="8" fill="#fff4e5" stroke="#cbd5e1"/><text x="795" y="185" text-anchor="middle" class="small">缩短训练暂停</text><rect x="45" y="240" width="135" height="68" rx="8" fill="#e9f7ef" stroke="#cbd5e1"/><text x="112.5" y="280" text-anchor="middle" class="label">共享性能层</text><rect x="190" y="240" width="230" height="68" rx="8" fill="#e9f7ef" stroke="#cbd5e1"/><text x="305" y="280" text-anchor="middle" class="small">manifest 与 commit 完成</text><rect x="430" y="240" width="235" height="68" rx="8" fill="#e9f7ef" stroke="#cbd5e1"/><text x="547.5" y="280" text-anchor="middle" class="small">按共享层冗余边界</text><rect x="675" y="240" width="240" height="68" rx="8" fill="#e9f7ef" stroke="#cbd5e1"/><text x="795" y="280" text-anchor="middle" class="small">常规快速恢复</text><rect x="45" y="335" width="135" height="68" rx="8" fill="#eef4ff" stroke="#cbd5e1"/><text x="112.5" y="375" text-anchor="middle" class="label">权威归档层</text><rect x="190" y="335" width="230" height="68" rx="8" fill="#eef4ff" stroke="#cbd5e1"/><text x="305" y="375" text-anchor="middle" class="small">复制校验与版本可见</text><rect x="430" y="335" width="235" height="68" rx="8" fill="#eef4ff" stroke="#cbd5e1"/><text x="547.5" y="375" text-anchor="middle" class="small">按跨域复制边界</text><rect x="675" y="335" width="240" height="68" rx="8" fill="#eef4ff" stroke="#cbd5e1"/><text x="795" y="375" text-anchor="middle" class="small">灾难恢复与长期保留</text><rect x="115" y="450" width="730" height="46" rx="8" fill="#f3f4f6"/><text x="480" y="479" text-anchor="middle" class="label">完成语义 = 数据落点 + commit 条件 + 声明故障域 + restore 证据</text></svg>