<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">先从显存总量扣除固定项，再计算 KV 容量</title><desc id="desc">容量估算；16 GiB 权重与 4 GiB 预留为示例输入，可替换</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">先从显存总量扣除固定项，再计算 KV 容量</text><text x="48" y="72" class="sub">容量估算；16 GiB 权重与 4 GiB 预留为示例输入，可替换</text><line x1="100" y1="440" x2="875" y2="440" class="axis"/><rect x="110" y="190" width="140.8" height="150" fill="#3b6fd4"/><text x="180.4" y="250" text-anchor="middle" fill="#fff" class="label">权重</text><text x="180.4" y="280" text-anchor="middle" fill="#fff" class="label">16 GiB</text><rect x="250.8" y="190" width="35.2" height="150" fill="#7c5cd4"/><text x="268.40000000000003" y="250" text-anchor="middle" fill="#fff" class="label">运行时与激活预留</text><text x="268.40000000000003" y="280" text-anchor="middle" fill="#fff" class="label">4 GiB</text><rect x="286" y="190" width="528" height="150" fill="#2e9e64"/><text x="550" y="250" text-anchor="middle" fill="#fff" class="label">KV Cache 可用池</text><text x="550" y="280" text-anchor="middle" fill="#fff" class="label">60 GiB</text><text x="110" y="390" class="label">80 GiB 标称显存</text><path d="M110 410 H814" stroke="#1f2937" stroke-width="2"/><text x="110" y="475" class="small">KV token 容量 = 60 GiB ÷ 每 token KV 字节数；并发上限还需除以业务上下文长度。</text></svg>