<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">任务期内至少一次中断的概率</title><desc id="desc">公式曲线；不包含任何硬件或集群故障率基准</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">任务期内至少一次中断的概率</text><text x="48" y="72" class="sub">公式曲线；不包含任何硬件或集群故障率基准</text><line x1="105" y1="125" x2="105" y2="445" class="axis"/><line x1="105" y1="445" x2="860" y2="445" class="axis"/><text x="485" y="503" text-anchor="middle" class="small">任务期内期望中断次数 μ</text><text x="30" y="285" transform="rotate(-90 30 285)" text-anchor="middle" class="small">至少一次中断概率（%）</text><line x1="99" y1="445" x2="860" y2="445" class="axis"/><text x="90" y="449" text-anchor="end" class="small">0</text><line x1="99" y1="365" x2="860" y2="365" class="grid"/><text x="90" y="369" text-anchor="end" class="small">25</text><line x1="99" y1="285" x2="860" y2="285" class="grid"/><text x="90" y="289" text-anchor="end" class="small">50</text><line x1="99" y1="205" x2="860" y2="205" class="grid"/><text x="90" y="209" text-anchor="end" class="small">75</text><line x1="99" y1="125" x2="860" y2="125" class="grid"/><text x="90" y="129" text-anchor="end" class="small">100</text><path d="M123.875,414.6 L152.1875,374.28 L199.375,319.24 L293.75,242.76 L482.5,168.2 L860,130.76" fill="none" stroke="#d64545" stroke-width="4"/><circle cx="123.875" cy="414.6" r="6" fill="#d64545"/><text x="123.875" y="468" text-anchor="middle" class="small">0.1</text><text x="123.875" y="402.6" text-anchor="middle" class="small">9.5%</text><circle cx="152.1875" cy="374.28" r="6" fill="#d64545"/><text x="152.1875" y="468" text-anchor="middle" class="small">0.25</text><text x="152.1875" y="362.28" text-anchor="middle" class="small">22.1%</text><circle cx="199.375" cy="319.24" r="6" fill="#d64545"/><text x="199.375" y="468" text-anchor="middle" class="small">0.5</text><text x="199.375" y="307.24" text-anchor="middle" class="small">39.3%</text><circle cx="293.75" cy="242.76" r="6" fill="#d64545"/><text x="293.75" y="468" text-anchor="middle" class="small">1</text><text x="293.75" y="230.76" text-anchor="middle" class="small">63.2%</text><circle cx="482.5" cy="168.2" r="6" fill="#d64545"/><text x="482.5" y="468" text-anchor="middle" class="small">2</text><text x="482.5" y="156.2" text-anchor="middle" class="small">86.5%</text><circle cx="860" cy="130.76" r="6" fill="#d64545"/><text x="860" y="468" text-anchor="middle" class="small">4</text><text x="860" y="118.75999999999999" text-anchor="middle" class="small">98.2%</text><text x="480" y="103" text-anchor="middle" class="small">P(N≥1)=1−exp(−μ)；Poisson 假设只用于初筛</text></svg>