<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">一次训练失败的检测与恢复时间线</title><desc id="desc">合成事故；每段应由事件时间戳、owner 与完成证据复算</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">一次训练失败的检测与恢复时间线</text><text x="48" y="72" class="sub">合成事故；每段应由事件时间戳、owner 与完成证据复算</text><text x="60" y="120" class="small">异常首次发生</text><text x="900" y="120" text-anchor="end" class="small">再次提交有效 step</text><rect x="60" y="150" width="112" height="105" fill="#7c5cd4"/><text x="116" y="188" text-anchor="middle" fill="#fff" class="label">检测</text><text x="116" y="218" text-anchor="middle" fill="#fff" class="label">8 min</text><rect x="172" y="150" width="56" height="105" fill="#d64545"/><text x="200" y="188" text-anchor="middle" fill="#fff" class="label">隔离</text><text x="200" y="218" text-anchor="middle" fill="#fff" class="label">4 min</text><rect x="228" y="150" width="168" height="105" fill="#d9822b"/><text x="312" y="188" text-anchor="middle" fill="#fff" class="label">资源等待</text><text x="312" y="218" text-anchor="middle" fill="#fff" class="label">12 min</text><rect x="396" y="150" width="84" height="105" fill="#3b6fd4"/><text x="438" y="188" text-anchor="middle" fill="#fff" class="label">进程组初始化</text><text x="438" y="218" text-anchor="middle" fill="#fff" class="label">6 min</text><rect x="480" y="150" width="140" height="105" fill="#2e9e64"/><text x="550" y="188" text-anchor="middle" fill="#fff" class="label">状态加载</text><text x="550" y="218" text-anchor="middle" fill="#fff" class="label">10 min</text><rect x="620" y="150" width="280" height="105" fill="#64748b"/><text x="760" y="188" text-anchor="middle" fill="#fff" class="label">数据回放</text><text x="760" y="218" text-anchor="middle" fill="#fff" class="label">20 min</text><rect x="70" y="310" width="260" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="332" text-anchor="middle" class="label">检测 · 监控</text><text x="200" y="351" text-anchor="middle" class="small">完成证据：step_heartbeat</text><rect x="355" y="310" width="260" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="485" y="332" text-anchor="middle" class="label">隔离 · 基础设施</text><text x="485" y="351" text-anchor="middle" class="small">完成证据：fault_domain</text><rect x="640" y="310" width="260" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="770" y="332" text-anchor="middle" class="label">资源等待 · 调度器</text><text x="770" y="351" text-anchor="middle" class="small">完成证据：allocation_event</text><rect x="70" y="385" width="260" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="200" y="407" text-anchor="middle" class="label">进程组初始化 · 运行时</text><text x="200" y="426" text-anchor="middle" class="small">完成证据：group_ready</text><rect x="355" y="385" width="260" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="485" y="407" text-anchor="middle" class="label">状态加载 · 训练工程</text><text x="485" y="426" text-anchor="middle" class="small">完成证据：restore_complete</text><rect x="640" y="385" width="260" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="770" y="407" text-anchor="middle" class="label">数据回放 · 任务</text><text x="770" y="426" text-anchor="middle" class="small">完成证据：accepted_step</text><text x="480" y="493" text-anchor="middle" class="small">端到端 60 min；合成时长只展示分账结构，不代表恢复 SLO。</text></svg>