<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">一次同步训练事故的证据时间线</title><desc id="desc">合成案例；时间与规模仅用于展示排查顺序，不代表生产实测</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">一次同步训练事故的证据时间线</text><text x="48" y="72" class="sub">合成案例；时间与规模仅用于展示排查顺序，不代表生产实测</text><line x1="90" y1="245" x2="875" y2="245" stroke="#9ca3af" stroke-width="3"/><line x1="105" y1="245" x2="105" y2="190" stroke="#d9822b"/><circle cx="105" cy="245" r="8" fill="#d9822b"/><text x="105" y="122" text-anchor="middle" class="label">任务绑定完成</text><text x="105" y="145" text-anchor="middle" class="small">64 卡已分配</text><text x="105" y="270" text-anchor="middle" class="small">0 min</text><line x1="290" y1="245" x2="290" y2="300" stroke="#d9822b"/><circle cx="290" cy="245" r="8" fill="#d9822b"/><text x="290" y="329" text-anchor="middle" class="label">通信组初始化</text><text x="290" y="352" text-anchor="middle" class="small">跨越两个互联域</text><text x="290" y="270" text-anchor="middle" class="small">2 min</text><line x1="475" y1="245" x2="475" y2="190" stroke="#d9822b"/><circle cx="475" cy="245" r="8" fill="#d9822b"/><text x="475" y="122" text-anchor="middle" class="label">首个 step 完成</text><text x="475" y="145" text-anchor="middle" class="small">AllReduce 等待占比 61%</text><text x="475" y="270" text-anchor="middle" class="small">7 min</text><line x1="660" y1="245" x2="660" y2="300" stroke="#d9822b"/><circle cx="660" cy="245" r="8" fill="#d9822b"/><text x="660" y="329" text-anchor="middle" class="label">链路出现长尾</text><text x="660" y="352" text-anchor="middle" class="small">P99 step time 翻倍</text><text x="660" y="270" text-anchor="middle" class="small">18 min</text><line x1="845" y1="245" x2="845" y2="190" stroke="#d9822b"/><circle cx="845" cy="245" r="8" fill="#d9822b"/><text x="845" y="122" text-anchor="middle" class="label">任务中止</text><text x="845" y="145" text-anchor="middle" class="small">最后 checkpoint 为 4 小时前</text><text x="845" y="270" text-anchor="middle" class="small">31 min</text><rect x="70" y="430" width="820" height="58" rx="10" fill="#fdecec"/><text x="480" y="455" text-anchor="middle" class="label">证据链：调度快照 → 通信 trace → step 长尾 → checkpoint 恢复窗口</text><text x="480" y="477" text-anchor="middle" class="small">任何单一“GPU 利用率”曲线都无法解释这次失败</text></svg>