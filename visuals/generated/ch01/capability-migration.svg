<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">能力迁移不是一张“全部复用”清单</title><desc id="desc">绿色保留方法，橙色重做资源语义，红色放弃原前提</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">能力迁移不是一张“全部复用”清单</text><text x="48" y="72" class="sub">绿色保留方法，橙色重做资源语义，红色放弃原前提</text><text x="55" y="122" class="label">大数据经验</text><text x="760" y="122" class="label">AI Infra 落点</text><text x="55" y="170" class="label">调度与配额</text><rect x="300" y="145" width="390" height="38" rx="8" fill="#fff4e5" stroke="#d9822b"/><text x="495" y="170" text-anchor="middle" class="label">重构后复用</text><path d="M700 164 H742" stroke="#9ca3af" marker-end="url(#a)"/><text x="55" y="226" class="label">存储治理</text><rect x="300" y="201" width="390" height="38" rx="8" fill="#fff4e5" stroke="#d9822b"/><text x="495" y="226" text-anchor="middle" class="label">重构后复用</text><path d="M700 220 H742" stroke="#9ca3af" marker-end="url(#a)"/><text x="55" y="282" class="label">数据管道</text><rect x="300" y="257" width="390" height="38" rx="8" fill="#fff4e5" stroke="#d9822b"/><text x="495" y="282" text-anchor="middle" class="label">重构后复用</text><path d="M700 276 H742" stroke="#9ca3af" marker-end="url(#a)"/><text x="55" y="338" class="label">可观测性</text><rect x="300" y="313" width="390" height="38" rx="8" fill="#fff4e5" stroke="#d9822b"/><text x="495" y="338" text-anchor="middle" class="label">重构后复用</text><path d="M700 332 H742" stroke="#9ca3af" marker-end="url(#a)"/><text x="55" y="394" class="label">故障模型</text><rect x="300" y="369" width="390" height="38" rx="8" fill="#fdecec" stroke="#d64545"/><text x="495" y="394" text-anchor="middle" class="label">失效：重新建模</text><path d="M700 388 H742" stroke="#9ca3af" marker-end="url(#a)"/><text x="55" y="450" class="label">弹性前提</text><rect x="300" y="425" width="390" height="38" rx="8" fill="#fdecec" stroke="#d64545"/><text x="495" y="450" text-anchor="middle" class="label">失效：重新建模</text><path d="M700 444 H742" stroke="#9ca3af" marker-end="url(#a)"/><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#9ca3af"/></marker></defs><text x="55" y="500" class="small">分类为编辑用判断框架；具体边界由对应章节的机制与数据验证。</text></svg>