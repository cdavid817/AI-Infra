<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">70B 训练单卡显存瀑布</title><desc id="desc">容量示例；TP8×PP4、未启用 ZeRO、micro-batch=1，橙色项必须用目标框架实测替换</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">70B 训练单卡显存瀑布</text><text x="48" y="72" class="sub">容量示例；TP8×PP4、未启用 ZeRO、micro-batch=1，橙色项必须用目标框架实测替换</text><text x="45" y="105" class="small">扣减项</text><text x="300" y="105" class="small">扣减后的剩余容量</text><text x="45" y="143" class="label">BF16权重</text><text x="265" y="143" text-anchor="end" class="small">−4.375 GB</text><rect x="300" y="120" width="506.6875" height="31" rx="5" fill="#3b6fd4" opacity=".78"/><text x="818.6875" y="141" class="small">余 75.6 GB</text><text x="45" y="191" class="label">BF16梯度</text><text x="265" y="191" text-anchor="end" class="small">−4.375 GB</text><rect x="300" y="168" width="477.375" height="31" rx="5" fill="#3b6fd4" opacity=".78"/><text x="789.375" y="189" class="small">余 71.3 GB</text><text x="45" y="239" class="label">FP32主权重</text><text x="265" y="239" text-anchor="end" class="small">−8.75 GB</text><rect x="300" y="216" width="418.75" height="31" rx="5" fill="#3b6fd4" opacity=".78"/><text x="730.75" y="237" class="small">余 62.5 GB</text><text x="45" y="287" class="label">Adam一阶矩</text><text x="265" y="287" text-anchor="end" class="small">−8.75 GB</text><rect x="300" y="264" width="360.125" height="31" rx="5" fill="#3b6fd4" opacity=".78"/><text x="672.125" y="285" class="small">余 53.8 GB</text><text x="45" y="335" class="label">Adam二阶矩</text><text x="265" y="335" text-anchor="end" class="small">−8.75 GB</text><rect x="300" y="312" width="301.5" height="31" rx="5" fill="#3b6fd4" opacity=".78"/><text x="613.5" y="333" class="small">余 45 GB</text><text x="45" y="383" class="label">选择性重计算激活</text><text x="265" y="383" text-anchor="end" class="small">−5 GB</text><rect x="300" y="360" width="268" height="31" rx="5" fill="#d9822b" opacity=".92"/><text x="580" y="381" class="small">余 40 GB</text><text x="45" y="431" class="label">运行时与通信预留</text><text x="265" y="431" text-anchor="end" class="small">−6 GB</text><rect x="300" y="408" width="227.8" height="31" rx="5" fill="#d9822b" opacity=".92"/><text x="539.8" y="429" class="small">余 34 GB</text><rect x="45" y="475" width="16" height="16" class="blue"/><text x="68" y="488" class="small">公式项</text><rect x="175" y="475" width="16" height="16" class="orange"/><text x="198" y="488" class="small">待实测假设</text><rect x="340" y="463" width="560" height="42" rx="8" fill="#f3f4f6"/><text x="620" y="489" text-anchor="middle" class="label">最终余量 34 GB；若任一橙色项上升，余量同比减少</text></svg>