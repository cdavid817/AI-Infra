<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">容量工作表把输入、假设和输出分开</title><desc id="desc">70B 合成容量示例；工期为不含故障、维护与 checkpoint 停顿的理想计算时长</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">容量工作表把输入、假设和输出分开</text><text x="48" y="72" class="sub">70B 合成容量示例；工期为不含故障、维护与 checkpoint 停顿的理想计算时长</text><rect x="45" y="125" width="160" height="159" rx="10" fill="#eef4ff" stroke="#cbd5e1"/><text x="125" y="154" text-anchor="middle" class="label">结构输入</text><text x="57" y="188" class="small">总参数量</text><text x="193" y="207" text-anchor="end" class="label">70B</text><text x="57" y="230" class="small">层数×隐藏维度</text><text x="193" y="249" text-anchor="end" class="label">80×8192</text><path d="M208 255 H222" stroke="#6b7280" stroke-width="2" marker-end="url(#wa)"/><rect x="225" y="125" width="160" height="117" rx="10" fill="#fff4e5" stroke="#cbd5e1"/><text x="305" y="154" text-anchor="middle" class="label">负载输入</text><text x="237" y="188" class="small">训练token量</text><text x="373" y="207" text-anchor="end" class="label">15T</text><path d="M388 255 H402" stroke="#6b7280" stroke-width="2" marker-end="url(#wa)"/><rect x="405" y="125" width="160" height="201" rx="10" fill="#e9f7ef" stroke="#cbd5e1"/><text x="485" y="154" text-anchor="middle" class="label">系统假设</text><text x="417" y="188" class="small">单卡BF16峰值</text><text x="553" y="207" text-anchor="end" class="label">1PFLOPS</text><text x="417" y="230" class="small">MFU</text><text x="553" y="249" text-anchor="end" class="label">40%</text><text x="417" y="272" class="small">并行配置</text><text x="553" y="291" text-anchor="end" class="label">TP8×PP4×DP32</text><path d="M568 255 H582" stroke="#6b7280" stroke-width="2" marker-end="url(#wa)"/><rect x="585" y="125" width="160" height="159" rx="10" fill="#f3eeff" stroke="#cbd5e1"/><text x="665" y="154" text-anchor="middle" class="label">显存输出</text><text x="597" y="188" class="small">静态模型状态每卡</text><text x="733" y="207" text-anchor="end" class="label">35GB</text><text x="597" y="230" class="small">激活每卡</text><text x="733" y="249" text-anchor="end" class="label">4–6GB</text><path d="M748 255 H762" stroke="#6b7280" stroke-width="2" marker-end="url(#wa)"/><rect x="765" y="125" width="160" height="117" rx="10" fill="#fdecec" stroke="#cbd5e1"/><text x="845" y="154" text-anchor="middle" class="label">算力输出</text><text x="777" y="188" class="small">总训练算力</text><text x="913" y="207" text-anchor="end" class="label">6.3e24FLOPs</text><path d="M928 255 H942" stroke="#6b7280" stroke-width="2" marker-end="url(#wa)"/><rect x="945" y="125" width="160" height="159" rx="10" fill="undefined" stroke="#cbd5e1"/><text x="1025" y="154" text-anchor="middle" class="label">工期输出</text><text x="957" y="188" class="small">1024卡理想工期</text><text x="1093" y="207" text-anchor="end" class="label">178天</text><text x="957" y="230" class="small">2048卡理想工期</text><text x="1093" y="249" text-anchor="end" class="label">89天</text><defs><marker id="wa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#6b7280"/></marker></defs><rect x="50" y="455" width="860" height="45" rx="8" fill="#f3f4f6"/><text x="480" y="483" text-anchor="middle" class="label">配置文件给结构，需求单给负载，规格与实测给系统系数；输出不得隐藏输入性质</text></svg>