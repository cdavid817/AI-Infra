<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">从占卡到有效模型 FLOPs 的三层漏斗</title><desc id="desc">512 卡合成容量示例；85% × 62% × 40% = 21.1%，不代表生产基准</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">从占卡到有效模型 FLOPs 的三层漏斗</text><text x="48" y="72" class="sub">512 卡合成容量示例；85% × 62% × 40% = 21.1%，不代表生产基准</text><rect x="120" y="118" width="720" height="54" rx="8" fill="#1f2937" opacity=".78"/><text x="480" y="141" text-anchor="middle" fill="#fff" class="label">集群理论峰值</text><text x="480" y="161" text-anchor="middle" fill="#fff" class="small">100%</text><rect x="174" y="200" width="612" height="54" rx="8" fill="#3b6fd4" opacity=".9"/><text x="480" y="223" text-anchor="middle" fill="#fff" class="label">已分配卡时</text><text x="480" y="243" text-anchor="middle" fill="#fff" class="small">85%</text><text x="850" y="231" class="small">占用率 85%</text><rect x="290.28" y="282" width="379.44000000000005" height="54" rx="8" fill="#7c5cd4" opacity=".9"/><text x="480" y="305" text-anchor="middle" fill="#fff" class="label">有效训练窗口</text><text x="480" y="325" text-anchor="middle" fill="#fff" class="small">52.7%</text><text x="850" y="313" class="small">85% × 62%</text><rect x="404.03999999999996" y="364" width="151.92000000000002" height="54" rx="8" fill="#2e9e64" opacity=".9"/><text x="480" y="387" text-anchor="middle" fill="#fff" class="label">有效模型 FLOPs</text><text x="480" y="407" text-anchor="middle" fill="#fff" class="small">21.1%</text><text x="850" y="