<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">低产出归因不是一张自动定责表</title><desc id="desc">编辑诊断矩阵；阈值应来自同类任务基线，行动项必须经过受控实验</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">低产出归因不是一张自动定责表</text><text x="48" y="72" class="sub">编辑诊断矩阵；阈值应来自同类任务基线，行动项必须经过受控实验</text><text x="120" y="116" text-anchor="middle" class="label">候选原因</text><text x="325" y="116" text-anchor="middle" class="label">主证据</text><text x="575" y="116" text-anchor="middle" class="label">单变量实验</text><text x="810" y="116" text-anchor="middle" class="label">移交前证据</text><rect x="45" y="135" width="150" height="62" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="120" y="172" text-anchor="middle" class="label">生命周期空窗</text><rect x="205" y="135" width="240" height="62" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="325" y="172" text-anchor="middle" class="small">作业事件与首末 step</text><rect x="455" y="135" width="240" height="62" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="575" y="172" text-anchor="middle" class="small">影子回收或缩短启动链路</text><rect x="705" y="135" width="210" height="62" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="810" y="172" text-anchor="middle" class="small">中断清单与恢复结果</text><rect x="45" y="217" width="150" height="62" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="120" y="254" text-anchor="middle" class="label">数据等待</text><rect x="205" y="217" width="240" height="62" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="325" y="254" text-anchor="middle" class="small">data_time 与存储延迟</text><rect x="455" y="217" width="240" height="62" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="575" y="254" text-anchor="middle" class="small">本地缓存或 worker 单变量</text><rect x="705" y="217" width="210" height="62" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="810" y="254" text-anchor="middle" class="small">吞吐随输入路径恢复</text><rect x="45" y="299" width="150" height="62" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="120" y="336" text-anchor="middle" class="label">通信等待</text><rect x="205" y="299" width="240" height="62" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="325" y="336" text-anchor="middle" class="small">未重叠集合通信时间线</text><rect x="455" y="299" width="240" height="62" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="575" y="336" text-anchor="middle" class="small">放置域或 bucket 单变量</text><rect x="705" y="299" width="210" height="62" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="810" y="336" text-anchor="middle" class="small">实测与拓扑模型收敛</text><rect x="45" y="381" width="150" height="62" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="120" y="418" text-anchor="middle" class="label">kernel 低效</text><rect x="205" y="381" width="240" height="62" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="325" y="418" text-anchor="middle" class="small">MFU 与算子形状</text><rect x="455" y="381" width="240" height="62" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="575" y="418" text-anchor="middle" class="small">精度融合或 micro-batch 单变量</text><rect x="705" y="381" width="210" height="62" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="810" y="418" text-anchor="middle" class="small">Roofline 与吞吐共同改善</text><path d="M120 475 H840" stroke="#6b7280" stroke-width="2" marker-end="url(#mxa)"/><defs><marker id="mxa" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8Z" fill="#6b7280"/></marker></defs><text x="480" y="505" text-anchor="middle" class="small">指标提出假设 → 时间线限定范围 → 受控实验验证 → 再移交行动项</text></svg>