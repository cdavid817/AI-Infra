<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">流水线气泡的理想下界</title><desc id="desc">p=4 的公式曲线；不代表 1F1B 或 interleaved schedule 的实测值</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">流水线气泡的理想下界</text><text x="48" y="72" class="sub">p=4 的公式曲线；不代表 1F1B 或 interleaved schedule 的实测值</text><line x1="90" y1="125" x2="90" y2="445" class="axis"/><line x1="90" y1="445" x2="665" y2="445" class="axis"/><text x="375" y="500" text-anchor="middle" class="small">microbatch 数 m</text><text x="28" y="285" transform="rotate(-90 28 285)" text-anchor="middle" class="small">理想气泡率（%）</text><line x1="84" y1="445" x2="665" y2="445" class="axis"/><text x="75" y="449" text-anchor="end" class="small">0</text><line x1="84" y1="365" x2="665" y2="365" class="grid"/><text x="75" y="369" text-anchor="end" class="small">20</text><line x1="84" y1="285" x2="665" y2="285" class="grid"/><text x="75" y="289" text-anchor="end" class="small">40</text><line x1="84" y1="205" x2="665" y2="205" class="grid"/><text x="75" y="209" text-anchor="end" class="small">60</text><line x1="84" y1="125" x2="665" y2="125" class="grid"/><text x="75" y="129" text-anchor="end" class="small">80</text><path d="M110,145 L215,205 L320,273.4 L425,335.8 L530,381.8 L635,410.6" fill="none" stroke="#3b6fd4" stroke-width="4"/><circle cx="110" cy="145" r="6" fill="#3b6fd4"/><text x="110" y="468" text-anchor="middle" class="small">1</text><text x="110" y="133" text-anchor="middle" class="small">75.0%</text><circle cx="215" cy="205" r="6" fill="#3b6fd4"/><text x="215" y="468" text-anchor="middle" class="small">2</text><text x="215" y="193" text-anchor="middle" class="small">60.0%</text><circle cx="320" cy="273.4" r="6" fill="#3b6fd4"/><text x="320" y="468" text-anchor="middle" class="small">4</text><text x="320" y="261.4" text-anchor="middle" class="small">42.9%</text><circle cx="425" cy="335.8" r="6" fill="#3b6fd4"/><text x="425" y="468" text-anchor="middle" class="small">8</text><text x="425" y="323.8" text-anchor="middle" class="small">27.3%</text><circle cx="530" cy="381.8" r="6" fill="#3b6fd4"/><text x="530" y="468" text-anchor="middle" class="small">16</text><text x="530" y="369.8" text-anchor="middle" class="small">15.8%</text><circle cx="635" cy="410.6" r="6" fill="#3b6fd4"/><text x="635" y="468" text-anchor="middle" class="small">32</text><text x="635" y="398.6" text-anchor="middle" class="small">8.6%</text><rect x="700" y="145" width="210" height="205" rx="10" fill="#fff4e5"/><text x="805" y="178" text-anchor="middle" class="label">公式假设</text><text x="805" y="211" text-anchor="middle" class="small">p = 4 且各 stage 等时</text><text x="805" y="239" text-anchor="middle" class="small">GPipe 式灌入 / 排空</text><text x="805" y="267" text-anchor="middle" class="small">忽略通信与调度开销</text><text x="805" y="310" text-anchor="middle" class="label">实测另加</text><text x="805" y="338" text-anchor="middle" class="small">失衡、P2P、运行时空闲</text></svg>