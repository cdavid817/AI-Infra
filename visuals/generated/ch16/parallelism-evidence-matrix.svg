<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">并行轴的通信证据矩阵</title><desc id="desc">编辑矩阵；不预设某个框架的固定 collective 次数</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">并行轴的通信证据矩阵</text><text x="48" y="72" class="sub">编辑矩阵；不预设某个框架的固定 collective 次数</text><text x="75" y="112" text-anchor="middle" class="label">轴</text><text x="190" y="112" text-anchor="middle" class="label">切分对象</text><text x="357.5" y="112" text-anchor="middle" class="label">主要载荷</text><text x="540" y="112" text-anchor="middle" class="label">发生频率</text><text x="777.5" y="112" text-anchor="middle" class="label">放置证据</text><rect x="45" y="132" width="60" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="75" y="161" text-anchor="middle" class="label">DP</text><rect x="115" y="132" width="150" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="190" y="161" text-anchor="middle" class="small">batch</text><rect x="275" y="132" width="165" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="357.5" y="161" text-anchor="middle" class="small">梯度 / 参数</text><rect x="450" y="132" width="180" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="540" y="161" text-anchor="middle" class="small">每 step</text><rect x="640" y="132" width="275" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="777.5" y="161" text-anchor="middle" class="small">DP 组与 bucket trace</text><rect x="45" y="196" width="60" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="75" y="225" text-anchor="middle" class="label">TP</text><rect x="115" y="196" width="150" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="190" y="225" text-anchor="middle" class="small">层内张量</text><rect x="275" y="196" width="165" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="357.5" y="225" text-anchor="middle" class="small">激活 / 部分和</text><rect x="450" y="196" width="180" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="540" y="225" text-anchor="middle" class="small">每层每微批</text><rect x="640" y="196" width="275" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="777.5" y="225" text-anchor="middle" class="small">TP 组与 collective trace</text><rect x="45" y="260" width="60" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="75" y="289" text-anchor="middle" class="label">PP</text><rect x="115" y="260" width="150" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="190" y="289" text-anchor="middle" class="small">layer / stage</text><rect x="275" y="260" width="165" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="357.5" y="289" text-anchor="middle" class="small">边界激活</text><rect x="450" y="260" width="180" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="540" y="289" text-anchor="middle" class="small">每边界每微批</text><rect x="640" y="260" width="275" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="777.5" y="289" text-anchor="middle" class="small">stage 映射与 P2P 时间线</text><rect x="45" y="324" width="60" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="75" y="353" text-anchor="middle" class="label">EP</text><rect x="115" y="324" width="150" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="190" y="353" text-anchor="middle" class="small">专家</text><rect x="275" y="324" width="165" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="357.5" y="353" text-anchor="middle" class="small">路由 token</text><rect x="450" y="324" width="180" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="540" y="353" text-anchor="middle" class="small">每 MoE 层每微批</text><rect x="640" y="324" width="275" height="48" rx="7" fill="#f8fafc" stroke="#cbd5e1"/><text x="777.5" y="353" text-anchor="middle" class="small">专家负载与 AllToAll trace</text><rect x="45" y="388" width="60" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="75" y="417" text-anchor="middle" class="label">CP</text><rect x="115" y="388" width="150" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="190" y="417" text-anchor="middle" class="small">序列上下文</text><rect x="275" y="388" width="165" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="357.5" y="417" text-anchor="middle" class="small">KV 分块</text><rect x="450" y="388" width="180" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="540" y="417" text-anchor="middle" class="small">每注意力层每微批</text><rect x="640" y="388" width="275" height="48" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="777.5" y="417" text-anchor="middle" class="small">CP 组与 attention 时间线</text><text x="480" y="493" text-anchor="middle" class="small">载荷公式只做预算；次数、算法、重叠和关键路径由目标图与 trace 确认。</text></svg>