<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">ZeRO 阶段改变的是哪一份状态</title><desc id="desc">容量示例；BF16 权重与梯度、FP32 master weights + Adam，DP=8</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">ZeRO 阶段改变的是哪一份状态</text><text x="48" y="72" class="sub">容量示例；BF16 权重与梯度、FP32 master weights + Adam，DP=8</text><text x="245" y="112" class="small">每个本地参数在单卡保留的字节数（DP=8；TP/PP 切分后再应用）</text><text x="185" y="172" text-anchor="end" class="label">DDP</text><rect x="210" y="145" width="76" height="38" fill="#3b6fd4"/><text x="248" y="170" text-anchor="middle" fill="#fff" class="small">2</text><rect x="286" y="145" width="76" height="38" fill="#2e9e64"/><text x="324" y="170" text-anchor="middle" fill="#fff" class="small">2</text><rect x="362" y="145" width="456" height="38" fill="#d9822b"/><text x="590" y="170" text-anchor="middle" fill="#fff" class="small">12</text><text x="830" y="171" class="label">Σ 16</text><text x="185" y="244" text-anchor="end" class="label">ZeRO-1</text><rect x="210" y="217" width="76" height="38" fill="#3b6fd4"/><text x="248" y="242" text-anchor="middle" fill="#fff" class="small">2</text><rect x="286" y="217" width="76" height="38" fill="#2e9e64"/><text x="324" y="242" text-anchor="middle" fill="#fff" class="small">2</text><rect x="362" y="217" width="57" height="38" fill="#d9822b"/><text x="390.5" y="242" text-anchor="middle" fill="#fff" class="small">1.5</text><text x="520" y="236" class="small">权/梯/优化器 = 2/2/1.5</text><text x="520" y="253" class="small">合计 5.5 B/param</text><text x="185" y="316" text-anchor="end" class="label">ZeRO-2</text><rect x="210" y="289" width="76" height="38" fill="#3b6fd4"/><text x="248" y="314" text-anchor="middle" fill="#fff" class="small">2</text><rect x="286" y="289" width="9.5" height="38" fill="#2e9e64"/><rect x="295.5" y="289" width="57" height="38" fill="#d9822b"/><text x="324" y="314" text-anchor="middle" fill="#fff" class="small">1.5</text><text x="520" y="308" class="small">权/梯/优化器 = 2/0.25/1.5</text><text x="520" y="325" class="small">合计 3.75 B/param</text><text x="185" y="388" text-anchor="end" class="label">ZeRO-3</text><rect x="210" y="361" width="9.5" height="38" fill="#3b6fd4"/><rect x="219.5" y="361" width="9.5" height="38" fill="#2e9e64"/><rect x="229" y="361" width="57" height="38" fill="#d9822b"/><text x="257.5" y="386" text-anchor="middle" fill="#fff" class="small">1.5</text><text x="520" y="380" class="small">权/梯/优化器 = 0.25/0.25/1.5</text><text x="520" y="397" class="small">合计 2 B/param</text><rect x="245" y="458" width="16" height="16" fill="#3b6fd4"/><text x="268" y="471" class="small">权重</text><rect x="415" y="458" width="16" height="16" fill="#2e9e64"/><text x="438" y="471" class="small">梯度</text><rect x="585" y="458" width="16" height="16" fill="#d9822b"/><text x="608" y="471" class="small">优化器状态</text><text x="245" y="510" class="small">图中只比较静态模型状态；激活、通信缓冲、临时聚合峰值和分配器余量另计。</text></svg>