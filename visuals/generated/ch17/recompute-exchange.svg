<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">重计算沿曲线用计算量换激活显存</title><desc id="desc">归一化容量示例；选择性与完全重计算为示意点，不是跨框架基准</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">重计算沿曲线用计算量换激活显存</text><text x="48" y="72" class="sub">归一化容量示例；选择性与完全重计算为示意点，不是跨框架基准</text><line x1="120" y1="440" x2="865" y2="440" class="axis"/><line x1="120" y1="120" x2="120" y2="440" class="axis"/><text x="490" y="505" text-anchor="middle" class="small">训练计算量指数（不重计算 = 100）</text><text x="35" y="280" transform="rotate(-90 35 280)" text-anchor="middle" class="small">激活显存指数（不重计算 = 100）</text><line x1="205.71428571428572" y1="440" x2="205.71428571428572" y2="446" class="axis"/><text x="205.71428571428572" y="467" text-anchor="middle" class="small">100</text><line x1="377.14285714285717" y1="440" x2="377.14285714285717" y2="446" class="axis"/><text x="377.14285714285717" y="467" text-anchor="middle" class="small">110</text><line x1="548.5714285714286" y1="440" x2="548.5714285714286" y2="446" class="axis"/><text x="548.5714285714286" y="467" text-anchor="middle" class="small">120</text><line x1="720" y1="440" x2="720" y2="446" class="axis"/><text x="720" y="467" text-anchor="middle" class="small">130</text><line x1="114" y1="440" x2="120" y2="440" class="axis"/><text x="105" y="444" text-anchor="end" class="small">0</text><line x1="114" y1="369.54545454545456" x2="120" y2="369.54545454545456" class="axis"/><text x="105" y="373.54545454545456" text-anchor="end" class="small">25</text><line x1="114" y1="299.0909090909091" x2="120" y2="299.0909090909091" class="axis"/><text x="105" y="303.0909090909091" text-anchor="end" class="small">50</text><line x1="114" y1="228.63636363636365" x2="120" y2="228.63636363636365" class="axis"/><text x="105" y="232.63636363636365" text-anchor="end" class="small">75</text><line x1="114" y1="158.1818181818182" x2="120" y2="158.1818181818182" class="axis"/><text x="105" y="162.1818181818182" text-anchor="end" class="small">100</text><path d="M205.71428571428572,158.1818181818182 L342.8571428571429,327.27272727272725 L771.4285714285714,406.1818181818182" fill="none" stroke="#9ca3af" stroke-width="3" stroke-dasharray="7 5"/><circle cx="205.71428571428572" cy="158.1818181818182" r="10" fill="#3b6fd4"/><text x="219.71428571428572" y="144.1818181818182" text-anchor="start" class="label">不重计算</text><text x="219.71428571428572" y="165.1818181818182" text-anchor="start" class="small">激活 100 / 计算 100</text><circle cx="342.8571428571429" cy="327.27272727272725" r="10" fill="#2e9e64"/><text x="356.8571428571429" y="313.27272727272725" text-anchor="start" class="label">选择性重计算</text><text x="356.8571428571429" y="334.27272727272725" text-anchor="start" class="small">激活 40 / 计算 108</text><circle cx="771.4285714285714" cy="406.1818181818182" r="10" fill="#d9822b"/><text x="759.4285714285714" y="392.1818181818182" text-anchor="end" class="label">完全重计算</text><text x="759.4285714285714" y="413.1818181818182" text-anchor="end" class="small">激活 12 / 计算 133</text><rect x="495" y="125" width="360" height="48" rx="8" fill="#fff4e5"/><text x="675" y="146" text-anchor="middle" class="small">示意点只说明交换方向，不承诺固定收益</text><text x="675" y="164" text-anchor="middle" class="small">目标框架、算子与序列形状必须实测</text></svg>