<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Kernel 时间线优化前后对照</title><desc id="desc">合成微秒数；只展示 launch 与中间张量往返被删除的证据结构</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">Kernel 时间线优化前后对照</text><text x="48" y="72" class="sub">合成微秒数；只展示 launch 与中间张量往返被删除的证据结构</text><text x="140" y="190" text-anchor="end" class="label">优化前</text><rect x="160" y="155" width="68" height="70" fill="#9ca3af"/><text x="194" y="185" text-anchor="middle" fill="#fff" class="small">CPU_gap_1</text><text x="194" y="207" text-anchor="middle" fill="#fff" class="small">10 μs</text><rect x="228" y="155" width="122.39999999999999" height="70" fill="#3b6fd4"/><text x="289.2" y="185" text-anchor="middle" fill="#fff" class="small">LayerNorm</text><text x="289.2" y="207" text-anchor="middle" fill="#fff" class="small">18 μs</text><rect x="350.4" y="155" width="81.6" height="70" fill="#d9822b"/><text x="391.2" y="185" text-anchor="middle" fill="#fff" class="small">HBM_roundtrip_1</text><text x="391.2" y="207" text-anchor="middle" fill="#fff" class="small">12 μs</text><rect x="432" y="155" width="68" height="70" fill="#9ca3af"/><text x="466" y="185" text-anchor="middle" fill="#fff" class="small">CPU_gap_2</text><text x="466" y="207" text-anchor="middle" fill="#fff" class="small">10 μs</text><rect x="500" y="155" width="108.8" height="70" fill="#3b6fd4"/><text x="554.4" y="185" text-anchor="middle" fill="#fff" class="small">Residual</text><text x="554.4" y="207" text-anchor="middle" fill="#fff" class="small">16 μs</text><rect x="608.8" y="155" width="81.6" height="70" fill="#d9822b"/><text x="649.5999999999999" y="185" text-anchor="middle" fill="#fff" class="small">HBM_roundtrip_2</text><text x="649.5999999999999" y="207" text-anchor="middle" fill="#fff" class="small">12 μs</text><rect x="690.4" y="155" width="68" height="70" fill="#9ca3af"/><text x="724.4" y="185" text-anchor="middle" fill="#fff" class="small">CPU_gap_3</text><text x="724.4" y="207" text-anchor="middle" fill="#fff" class="small">10 μs</text><rect x="758.4" y="155" width="122.39999999999999" height="70" fill="#3b6fd4"/><text x="819.6" y="185" text-anchor="middle" fill="#fff" class="small">Activation</text><text x="819.6" y="207" text-anchor="middle" fill="#fff" class="small">18 μs</text><text x="892.8" y="195" class="label">106 μs</text><text x="140" y="345" text-anchor="end" class="label">优化后</text><rect x="160" y="310" width="68" height="70" fill="#9ca3af"/><text x="194" y="340" text-anchor="middle" fill="#fff" class="small">CPU_gap</text><text x="194" y="362" text-anchor="middle" fill="#fff" class="small">10 μs</text><rect x="228" y="310" width="299.2" height="70" fill="#2e9e64"/><text x="377.6" y="340" text-anchor="middle" fill="#fff" class="small">Fused_kernel</text><text x="377.6" y="362" text-anchor="middle" fill="#fff" class="small">44 μs</text><text x="539.2" y="350" class="label">54 μs</text><rect x="110" y="455" width="16" height="16" fill="#9ca3af"/><text x="135" y="468" class="small">CPU / launch gap</text><rect x="315" y="455" width="16" height="16" fill="#3b6fd4"/><text x="340" y="468" class="small">独立 kernel</text><rect x="520" y="455" width="16" height="16" fill="#d9822b"/><text x="545" y="468" class="small">中间张量往返</text><rect x="725" y="455" width="16" height="16" fill="#2e9e64"/><text x="750" y="468" class="small">融合 kernel</text></svg>