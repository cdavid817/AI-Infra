<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">迁移账必须同时保留一次性与持续成本</title><desc id="desc">32B 合成容量示例；人月仅用于演示账本结构，不代表行业估算</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">迁移账必须同时保留一次性与持续成本</text><text x="48" y="72" class="sub">32B 合成容量示例；人月仅用于演示账本结构，不代表行业估算</text><text x="515" y="106" text-anchor="middle" class="small">人月（一次性与每年持续投入不可直接相加）</text><text x="145" y="151" text-anchor="end" class="label">算子适配</text><rect x="165" y="128" width="300" height="18" rx="4" fill="#3b6fd4"/><rect x="165" y="151" width="37.5" height="18" rx="4" fill="#d9822b"/><text x="475" y="142" class="small">4</text><text x="212.5" y="165" class="small">0.5</text><text x="145" y="206" text-anchor="end" class="label">数值验证</text><rect x="165" y="183" width="112.5" height="18" rx="4" fill="#3b6fd4"/><rect x="165" y="206" width="37.5" height="18" rx="4" fill="#d9822b"/><text x="287.5" y="197" class="small">1.5</text><text x="212.5" y="220" class="small">0.5</text><text x="145" y="261" text-anchor="end" class="label">性能调优</text><rect x="165" y="238" width="225" height="18" rx="4" fill="#3b6fd4"/><rect x="165" y="261" width="37.5" height="18" rx="4" fill="#d9822b"/><text x="400" y="252" class="small">3</text><text x="212.5" y="275" class="small">0.5</text><text x="145" y="316" text-anchor="end" class="label">双后端 CI</text><rect x="165" y="293" width="37.5" height="18" rx="4" fill="#3b6fd4"/><rect x="165" y="316" width="187.5" height="18" rx="4" fill="#d9822b"/><text x="212.5" y="307" class="small">0.5</text><text x="362.5" y="330" class="small">2.5</text><text x="145" y="371" text-anchor="end" class="label">升级回归</text><rect x="165" y="348" width="37.5" height="18" rx="4" fill="#3b6fd4"/><rect x="165" y="371" width="112.5" height="18" rx="4" fill="#d9822b"/><text x="212.5" y="362" class="small">0.5</text><text x="287.5" y="385" class="small">1.5</text><text x="145" y="426" text-anchor="end" class="label">支持排障</text><rect x="165" y="403" width="37.5" height="18" rx="4" fill="#3b6fd4"/><rect x="165" y="426" width="150" height="18" rx="4" fill="#d9822b"/><text x="212.5" y="417" class="small">0.5</text><text x="325" y="440" class="small">2</text><rect x="620" y="160" width="18" height="12" class="blue"/><text x="648" y="171" class="small">一次性迁移</text><rect x="620" y="190" width="18" height="12" class="orange"/><text x="648" y="201" class="small">年度持续</text><rect x="585" y="240" width="290" height="92" rx="9" fill="#f3f4f6"/><text x="730" y="268" text-anchor="middle" class="label">账本使用方法</text><text x="730" y="292" text-anchor="middle" class="small">一次性投入按受益年限摊销</text><text x="730" y="313" text-anchor="middle" class="small">持续投入乘预计双栈年限</text><text x="480" y="500" text-anchor="middle" class="small">合成数值只展示分类；每项应给低/中/高情景、依据和置信度。</text></svg>