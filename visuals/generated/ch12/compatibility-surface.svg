<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">加速器迁移的五层适配面</title><desc id="desc">编辑诊断矩阵；适配层来自框架集成与生产运行边界，不表示特定平台成熟度</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">加速器迁移的五层适配面</text><text x="48" y="72" class="sub">编辑诊断矩阵；适配层来自框架集成与生产运行边界，不表示特定平台成熟度</text><text x="102.5" y="108" text-anchor="middle" class="label">适配层</text><text x="287.5" y="108" text-anchor="middle" class="label">所需证据</text><text x="525" y="108" text-anchor="middle" class="label">失败信号</text><text x="785" y="108" text-anchor="middle" class="label">迁移动作</text><rect x="40" y="125" width="125" height="52" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="102.5" y="156" text-anchor="middle" class="label">业务 API</text><rect x="175" y="125" width="225" height="52" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="287.5" y="156" text-anchor="middle" class="small">真实脚本与依赖清单</text><rect x="410" y="125" width="230" height="52" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="525" y="156" text-anchor="middle" class="small">平台分支散落业务代码</text><rect x="650" y="125" width="270" height="52" rx="7" fill="#eef4ff" stroke="#cbd5e1"/><text x="785" y="156" text-anchor="middle" class="small">收敛到薄适配层</text><rect x="40" y="193" width="125" height="52" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="102.5" y="224" text-anchor="middle" class="label">算子与自动微分</text><rect x="175" y="193" width="225" height="52" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="287.5" y="224" text-anchor="middle" class="small">前反向 trace 与 fallback</text><rect x="410" y="193" width="230" height="52" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="525" y="224" text-anchor="middle" class="small">CPU 回退或缺失梯度</text><rect x="650" y="193" width="270" height="52" rx="7" fill="#f3eeff" stroke="#cbd5e1"/><text x="785" y="224" text-anchor="middle" class="small">替换自研或排除</text><rect x="40" y="261" width="125" height="52" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="102.5" y="292" text-anchor="middle" class="label">精度与编译</text><rect x="175" y="261" width="225" height="52" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="287.5" y="292" text-anchor="middle" class="small">关键层和短程训练对照</text><rect x="410" y="261" width="230" height="52" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="525" y="292" text-anchor="middle" class="small">溢出或图编译分叉</text><rect x="650" y="261" width="270" height="52" rx="7" fill="#fff4e5" stroke="#cbd5e1"/><text x="785" y="292" text-anchor="middle" class="small">定位后重测质量</text><rect x="40" y="329" width="125" height="52" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="102.5" y="360" text-anchor="middle" class="label">集合通信</text><rect x="175" y="329" width="225" height="52" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="287.5" y="360" text-anchor="middle" class="small">目标规模 trace 与拓扑</text><rect x="410" y="329" width="230" height="52" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="525" y="360" text-anchor="middle" class="small">同步等待随规模放大</text><rect x="650" y="329" width="270" height="52" rx="7" fill="#e9f7ef" stroke="#cbd5e1"/><text x="785" y="360" text-anchor="middle" class="small">重选并行与放置</text><rect x="40" y="397" width="125" height="52" rx="7" fill="#fdecec" stroke="#cbd5e1"/><text x="102.5" y="428" text-anchor="middle" class="label">运行与恢复</text><rect x="175" y="397" width="225" height="52" rx="7" fill="#fdecec" stroke="#cbd5e1"/><text x="287.5" y="428" text-anchor="middle" class="small">长稳和 checkpoint 演练</text><rect x="410" y="397" width="230" height="52" rx="7" fill="#fdecec" stroke="#cbd5e1"/><text x="525" y="428" text-anchor="middle" class="small">失败后无法按 SLO 恢复</text><rect x="650" y="397" width="270" height="52" rx="7" fill="#fdecec" stroke="#cbd5e1"/><text x="785" y="428" text-anchor="middle" class="small">保留原后端退路</text><text x="480" y="500" text-anchor="middle" class="small">统一 API 只覆盖第一层；每层都要有版本、证据、责任人与退路。</text></svg>