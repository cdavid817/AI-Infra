<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">读规格书时，把四个数字放回负载画像</title><desc id="desc">合成规格指数；B=100，仅演示判断顺序，不代表任何真实产品</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif;fill:#1f2937}.title{font-size:25px;font-weight:700}.sub{font-size:14px;fill:#6b7280}.label{font-size:15px}.small{font-size:12px;fill:#6b7280}.axis{stroke:#9ca3af;stroke-width:1}.grid{stroke:#e5e7eb;stroke-width:1}.blue{fill:#3b6fd4}.green{fill:#2e9e64}.orange{fill:#d9822b}.purple{fill:#7c5cd4}.red{fill:#d64545}</style><rect width="960" height="540" rx="18" fill="#fff"/><text x="48" y="46" class="title">读规格书时，把四个数字放回负载画像</text><text x="48" y="72" class="sub">合成规格指数；B=100，仅演示判断顺序，不代表任何真实产品</text><text x="340" y="120" text-anchor="middle" class="label">候选 A</text><text x="620" y="120" text-anchor="middle" class="label">候选 B</text><text x="820" y="120" text-anchor="middle" class="label">本负载优先级</text><text x="55" y="179" class="label">目标精度算力</text><rect x="260" y="155" width="189" height="34" rx="6" fill="#3b6fd4" opacity=".65"/><text x="457" y="178" class="small">140</text><rect x="540" y="155" width="135" height="34" rx="6" fill="#3b6fd4"/><text x="683" y="178" class="small">100</text><circle cx="820" cy="172" r="13" fill="#3b6fd4"/><text x="850" y="177" class="small">2/4</text><text x="55" y="257" class="label">实际可用显存</text><rect x="260" y="233" width="101.25" height="34" rx="6" fill="#2e9e64" opacity=".65"/><text x="369.25" y="256" class="small">75</text><rect x="540" y="233" width="135" height="34" rx="6" fill="#2e9e64"/><text x="683" y="256" class="small">100</text><circle cx="820" cy="250" r="16" fill="#2e9e64"/><text x="850" y="255" class="small">3/4</text><text x="55" y="335" class="label">显存带宽</text><rect x="260" y="311" width="90.45" height="34" rx="6" fill="#d9822b" opacity=".65"/><text x="358.45" y="334" class="small">67</text><rect x="540" y="311" width="135" height="34" rx="6" fill="#d9822b"/><text x="683" y="334" class="small">100</text><circle cx="820" cy="328" r="19" fill="#d9822b"/><text x="850" y="333" class="small">4/4</text><text x="55" y="413" class="label">互联带宽</text><rect x="260" y="389" width="135" height="34" rx="6" fill="#7c5cd4" opacity=".65"/><text x="403" y="412" class="small">100</text><rect x="540" y="389" width="135" height="34" rx="6" fill="#7c5cd4"/><text x="683" y="412" class="small">100</text><circle cx="820" cy="406" r="10" fill="#7c5cd4"/><text x="850" y="411" class="small">1/4</text><rect x="55" y="470" width="850" height="44" rx="8" fill="#f3f4f6"/><text x="480" y="497" text-anchor="middle" class="label">先用精度支持和可用容量过滤，再按负载优先级比较带宽，峰值算力不能单独排序</text></svg>