section_notes:
  amd_intel_google: 'TPU 只能以云服务形态获得,没有采购决策,只有租用决策;其编译器主导的架构范式含义见 [§4.2.1](../第一部分-基础与心智模型/第04章-硬件第一性原理、架构范式与数值精度.md#421-四类范式真正的差异在编译器)。'
  domestic_intro: '国产卡的公开参数口径差异大、迭代快,本节数字请配合勘误页使用;**生态与迁移的判断框架见第 12 章与附录 E**,参数只是决策输入的一小部分。'
  domestic_disciplines:
    - '**参数表不能替代算子覆盖率盘点**——纸面 FLOPs 相同,算子缺一个融合实现,端到端性能可以差数倍([§12.4](../第二部分-算力底座/第12章-国产算力平台与异构迁移.md#124-混合集群管理双后端是常态而不是过渡),盘点表见附录 E)。'
    - '**对标必须用第 12 章的统一口径**(同精度、同 batch、同序列分布、端到端吞吐),厂商 benchmark 的口径差异足以制造 2 倍的假象([§12.5](../第二部分-算力底座/第12章-国产算力平台与异构迁移.md#125-性能对标的正确姿势全书唯一定义处))。'
    - '昇腾软件栈(CANN、HCCL、MindSpeed、MindIE)的对照关系见 [§5.3](../第一部分-基础与心智模型/第05章-CUDA、CANN与加速器软件栈.md#53-cann-与昇腾软件栈两套完整并行的世界)、[§7.4.5](../第一部分-基础与心智模型/第07章-互联与集合通信.md#745-hccl-与昇腾互联)、第 18 章、[§22.4](../第五部分-推理系统/第22章-推理引擎原理.md#224-引擎剖析方案对比) 与附录 C/D;**买卡决策的大头在软件栈,不在这张表**。'
