schema_version: 1
snapshot_date: "2026-08"
intro_notes:
  - '**算力一律取稠密(dense)值**。厂商宣传页普遍标注稀疏(2:4 structured sparsity)值,恰好是稠密值的 2 倍;看到与本表相差一倍的数字,先怀疑口径而不是数据错误(识别方法见 [§4.2.1](../第一部分-基础与心智模型/第04章-硬件第一性原理、架构范式与数值精度.md#421-四类范式真正的差异在编译器))。'
  - '**互联带宽为单卡双向聚合带宽**;个别厂商按单向标注,换算时乘 2。'
  - '**显存带宽为标称峰值**,实测可持续带宽约为标称的 80%~90%。'
  - '空缺("—")表示该精度无硬件原生支持或厂商未公开;国产卡部分公开口径不一的数字以"≈"标注,以厂商正式 spec 为准。'
tendency_notes:
  - '**这是倾向标注,不是"训练卡/推理卡"二分类**——正文已论证该二分法正在失效([§4.2.2](../第一部分-基础与心智模型/第04章-硬件第一性原理、架构范式与数值精度.md#422-训练型与推理型负载的硬件诉求差异)),同一张卡两侧都能跑,差别只在配比匹配度。'
  - '标注方法:拿 [§4.2.2](../第一部分-基础与心智模型/第04章-硬件第一性原理、架构范式与数值精度.md#422-训练型与推理型负载的硬件诉求差异) 六维表(显存容量、显存带宽、互联带宽、精度支持、可靠性、性价比口径)逐行比对上表数字,给出倾向。你拿到任何一张新卡,都应当自己重走一遍这个比对,而不是查这张表。'
