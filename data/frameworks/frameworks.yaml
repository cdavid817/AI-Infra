recommendations:
  kind: author_judgment
  intro: 矩阵给的是**默认起点**,不是终点;每格的失效边界在对应章节。规模档口径:小 = 单机 8 卡内,中 = 数机到百卡,大 = 数百到数千卡,超大 = 数千卡以上。
  training_matrix:
    scale_header:
      - 小(≤8 卡)
      - 中(~百卡)
      - 大(数百~数千卡)
      - 超大(数千卡+)
    rows:
      - scenario: 微调(SFT/LoRA)
        cells:
          - LLaMA-Factory / Axolotl 单机直跑
          - LLaMA-Factory + FSDP2,K8s Job 或 Slurm
          - 少见;若有,TorchTitan + FSDP2
          - '—'
      - scenario: 稠密预训练 / 继续预训练
        cells:
          - FSDP2(TorchTitan 起步)
          - FSDP2 或 Megatron-Core,Slurm/Volcano 编排
          - Megatron-Core(TP×PP×DP),Slurm
          - Megatron-Core + 容错体系(第 20 章)
      - scenario: MoE 预训练
        cells:
          - 不建议(EP 域太小)
          - Megatron-Core(EP 域内化,需超节点或单机 EP)
          - Megatron-Core + EP,域对齐见第 16 章
          - 同左,All2All 域内化是硬约束
      - scenario: RL 后训练
        cells:
          - TRL 单机
          - verl / OpenRLHF + Ray
          - verl(训推混合潮汐,第 21 章)
          - verl / slime
      - scenario: 昇腾集群训练
        cells:
          - torch_npu + LLaMA-Factory
          - MindSpeed 或 torch_npu+FSDP,Volcano
          - MindSpeed(PyTorch 路线)或 MindSpore
          - MindSpeed;两条路线取舍见第 18 章
  inference_matrix:
    scale_header:
      - 单卡~单机
      - 多实例(数机)
      - 大规模服务(数十机+)
    rows:
      - scenario: 通用对话 / API 服务
        cells:
          - vLLM 直跑
          - vLLM + KServe/Ray Serve
          - vLLM/SGLang + Dynamo(PD 分离)+ 网关层
      - scenario: Agent / 高前缀复用 / 结构化输出
        cells:
          - SGLang
          - SGLang + 编排层(KV 感知路由)
          - SGLang + Dynamo,前缀缓存策略见第 22 章
      - scenario: 极致单卡吞吐 / 延迟(NVIDIA)
        cells:
          - TensorRT-LLM
          - TensorRT-LLM + Triton Server
          - 同左 + KServe;绑定代价见第 12 章
      - scenario: 长上下文 / 大 KV
        cells:
          - vLLM(量化 KV)+ 大显存卡(附录 A)
          - PD 分离 + KV 分层(第 24 章)
          - 同左
      - scenario: 边缘 / 端侧
        cells:
          - llama.cpp / Ollama
          - '—'
          - '—'
      - scenario: 昇腾推理
        cells:
          - MindIE 或 vLLM-Ascend(取舍见 [§22.4](../第五部分-推理系统/第22章-推理引擎原理.md#224-引擎剖析方案对比))
          - 同左 + KServe/Volcano
          - MindIE 集群方案
  veto_rules:
    - '**跨层混比一票否决**:出现"vLLM 还是 KServe""Megatron 还是 Ray"式的问题,先回 [§2.4.3](../第一部分-基础与心智模型/第02章-两条主线解剖与框架地图.md#243-框架三层地图) 把层定对,再回来查矩阵。'
    - '**规模档跨档不外推**:小规模验证过的组合升档时,必须重算通信账(附录 B F15–F20)——百卡可行的方案千卡未必可行,反之亦然。'
    - '**昇腾侧选型先查算子覆盖率**(附录 E 盘点表),后查本矩阵:矩阵假设"该跑的都能跑",这个假设在异构迁移场景下必须先被验证(第 12 章)。'
shelf_life:
  - info_type: 层的划分与否决规则
    expected_shelf_life: 全书生命周期
    staleness_signal: 出现稳定占据两层的主流项目(需重画地图而非改清单)
  - info_type: 项目清单与定位
    expected_shelf_life: 12~24 个月
    staleness_signal: 某层出现新的事实标准;清单内项目停止维护
  - info_type: 选型矩阵推荐
    expected_shelf_life: 6~12 个月
    staleness_signal: 引擎层性能格局变化、昇腾侧适配状态变化
