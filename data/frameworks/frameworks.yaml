# 附录 C 框架选型快照数据(唯一事实源)。附录 C 由本文件生成。
schema_version: 1
snapshot_date: "2026-08"
intro_notes:
  - '**数据截至 2026 年 8 月。** 框架项目的半衰期远短于本书的生命周期,本附录是三层框架地图([§2.4.3](../第一部分-基础与心智模型/第02章-两条主线解剖与框架地图.md#243-框架三层地图))在成书时刻的一张快照:项目清单、版本态势与选型矩阵都会过时,**层的划分与选型方法不会**。使用前请核对[勘误与更新页](../ERRATA.md#附录-c框架选型快照)及对应项目的官方状态。'
  - '使用纪律(正文结论重申):任何框架对比只有发生在**同一层内**才有意义——vLLM vs KServe 之争等价于 Spark vs YARN 之争,是问错了问题([§2.4.3](../第一部分-基础与心智模型/第02章-两条主线解剖与框架地图.md#243-框架三层地图))。拿到本附录清单外的新项目,先把它放进层格子,再找同层项目对比;故意跨层的项目标注"占哪两格、与谁互斥",不要硬塞。'
