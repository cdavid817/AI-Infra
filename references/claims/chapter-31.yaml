    section: "从电费到碳账:功能单位与系统边界"
    summary: "SCI 框架把软件碳强度定义为 C per R:运行排放(能耗 E × 电网碳强度 I)加硬件隐含排放 M,全部要素按同一功能单位 R 缩放;中和/抵消类 offset 明确不降低分数,环境指标必须落在直接效率改进上"
    claim_type: mechanism
    evidence_level: L1
    sources: [SRC-GSF-SCI]
    status: verified
    reviewed_at: 2026-08-24
    review_after_days: 365

  - id: CLM-031-018
    section: "从电费到碳账:功能单位与系统边界"
    summary: "SCI for AI 将 SCI 框架扩展到 AI 全生命周期(数据准备、训练、部署、推理),按 AI 系统类型定义边界与功能单位;其细化程度属高时效信息,正文只写存在与定位,不写版本细节"
    claim_type: project_status
