  - id: CLM-031-019
    section: "从电费到碳账:功能单位与系统边界"
    summary: "power cap 与碳感知调度是有失效边界的降碳手段:cap 压低瞬时功率但拉长训练工期,总排放未必下降;碳感知迁移训练任务的前提是数据与 checkpoint 可低成本随行(第 9、14 章),推理受 SLO 锚定基本不可迁——两者都应按每功能单位总排放核算,而非只看功率曲线"
    claim_type: recommendation
    evidence_level: L2
    sources: [SRC-GSF-SCI]
    status: unverified
    reviewed_at: 2026-08-24
    review_after_days: 180
    disclosure: "判断性结论:'按每功能单位核算'的口径部分由 SCI 规范(SRC-GSF-SCI)直接支撑;cap 拉长工期、迁移的数据成本前提与推理不可迁等失效边界为作者基于调度与数据重力机制的工程推断,无公开实测来源,应按自身负载验证后再采纳。"
