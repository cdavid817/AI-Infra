    section: "把指标说同一种语言:OTel GenAI 语义约定"
    summary: OTel GenAI 语义约定以独立仓库维护,整体处 Development 稳定性阶段;token 用量与 finish_reasons 等为 Recommended 属性,采集器落地需为属性演进留缓冲层
