  - id: CLM-028-010
    section: "28.5 方案对比"
    summary: "量级数字(待补来源):gVisor 类用户态内核加固会带来两位数百分比的系统调用性能损耗;WASM 在高频短小纯计算负载下成本比容器/微 VM 低一到两个数量级。"
    claim_type: quantitative
    evidence_level: L4
    sources: []
