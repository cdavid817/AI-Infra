# 版本单一来源。三类版本的关系:
#   内容版本(version):正文与附录的语义变化;v0.x 阶段 MINOR=新增/重写章节级内容,PATCH=勘误与小修
#   数据快照(data_snapshot):附录 A/C 背后 data/ 的口径日期;可独立于内容版本更新
#   勘误(errata):滚动登记于 ERRATA.md,累积到一定量并入下一个 PATCH
schema_version: 1
version: 0.2.0
stage: release-candidate # draft → release-candidate → stable
content_snapshot: 2026-08
